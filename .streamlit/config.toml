[theme]
base = "dark"
primaryColor = "#D11A25"
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#28282B"
textColor = "#F5F5F5"
borderColor = "#48484C"
baseRadius = "large"
buttonRadius = "medium"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
headingFontSizes = ["42px", "30px", "23px", "20px", "18px", "16px"]
headingFontWeights = [800, 750, 700, 650, 600, 600]
baseFontSize = 16
linkColor = "#FF9399"
redColor = "#FF5964"
redTextColor = "#FF8E96"
redBackgroundColor = "#4B2228"
violetColor = "#B8A1FF"
violetTextColor = "#C8B7FF"
violetBackgroundColor = "#312447"
blueColor = "#6AA8FF"
blueTextColor = "#A0C7FF"
blueBackgroundColor = "#192E4B"
greenColor = "#5DD6B8"
greenTextColor = "#8EE8CF"
greenBackgroundColor = "#123D35"
orangeColor = "#F5AE70"
orangeTextColor = "#FFC99D"
orangeBackgroundColor = "#482C1C"
chartCategoricalColors = ["#FF5964", "#F5F5F5", "#B0B0B6", "#FF9399", "#77777F"]
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#161618"
secondaryBackgroundColor = "#242426"
textColor = "#F5F5F5"
primaryColor = "#FF8891"
borderColor = "#48484C"

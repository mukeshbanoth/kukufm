[theme]
base = "light"
primaryColor = "#D11A25"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F7"
textColor = "#18181B"
borderColor = "#D9D9DF"
baseRadius = "large"
buttonRadius = "medium"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
headingFontSizes = ["46px", "32px", "24px", "20px", "18px", "16px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseFontSize = 16
linkColor = "#BA1521"
redColor = "#D11A25"
redTextColor = "#BA1521"
redBackgroundColor = "#FDECEE"
violetColor = "#7145BB"
violetTextColor = "#6334AD"
violetBackgroundColor = "#F0EAF8"
blueColor = "#2368B0"
blueTextColor = "#18518D"
blueBackgroundColor = "#E9F2FC"
greenColor = "#17715B"
greenTextColor = "#115C49"
greenBackgroundColor = "#E6F5EF"
orangeColor = "#AD4E10"
orangeTextColor = "#923D08"
orangeBackgroundColor = "#FFF0E5"
chartCategoricalColors = ["#D11A25", "#18181B", "#63636C", "#B65B61", "#93939D"]
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F6F6F7"
secondaryBackgroundColor = "#ECECEE"
textColor = "#18181B"
primaryColor = "#D11A25"
borderColor = "#D9D9DF"

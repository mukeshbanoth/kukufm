[theme]
base = "light"
primaryColor = "#BE123C"
backgroundColor = "#FFF8FA"
secondaryBackgroundColor = "#FCEAF0"
textColor = "#202038"
borderColor = "#F0CED9"
baseRadius = "large"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
headingFontSizes = ["46px", "30px", "23px", "20px", "18px", "16px"]
headingFontWeights = [800, 750, 700, 650, 600, 600]
baseFontSize = 16
linkColor = "#BE123C"
violetColor = "#7C3AED"
violetTextColor = "#6220BB"
violetBackgroundColor = "#EBDEFF"
blueColor = "#2563EB"
blueTextColor = "#1E40AF"
blueBackgroundColor = "#DBEAFE"
greenColor = "#0F766E"
greenTextColor = "#115E59"
greenBackgroundColor = "#CCFBF1"
orangeColor = "#C2410C"
orangeTextColor = "#9A3412"
orangeBackgroundColor = "#FFEDD5"
chartCategoricalColors = ["#7C3AED", "#0F766E", "#DB2777", "#2563EB", "#C2410C"]
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#211A30"
secondaryBackgroundColor = "#30204F"
textColor = "#F8F4FF"
primaryColor = "#C4B5FD"
borderColor = "#4B3867"

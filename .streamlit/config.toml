[theme]
base = "dark"
primaryColor = "#C91625"
backgroundColor = "#0D0F14"
secondaryBackgroundColor = "#191D26"
textColor = "#F3F5FA"
borderColor = "#394150"
baseRadius = "large"
buttonRadius = "medium"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
headingFontSizes = ["42px", "30px", "23px", "20px", "18px", "16px"]
headingFontWeights = [800, 750, 700, 650, 600, 600]
baseFontSize = 16
linkColor = "#FF8891"
redColor = "#FF5966"
redTextColor = "#FF9CA5"
redBackgroundColor = "#481923"
violetColor = "#B8A1FF"
violetTextColor = "#C8B7FF"
violetBackgroundColor = "#312447"
blueColor = "#6AA8FF"
blueTextColor = "#A0C7FF"
blueBackgroundColor = "#192E4B"
greenColor = "#5DD6B8"
greenTextColor = "#8EE8CF"
greenBackgroundColor = "#123D35"
orangeColor = "#F5AE70"
orangeTextColor = "#FFC99D"
orangeBackgroundColor = "#482C1C"
chartCategoricalColors = ["#FF5966", "#6AA8FF", "#5DD6B8", "#B8A1FF", "#F5AE70"]
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#11141B"
secondaryBackgroundColor = "#1D222D"
textColor = "#F3F5FA"
primaryColor = "#FF8891"
borderColor = "#394150"
